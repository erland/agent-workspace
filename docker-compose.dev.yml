services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_workspace
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_workspace"]
      interval: 2s
      timeout: 2s
      retries: 20
