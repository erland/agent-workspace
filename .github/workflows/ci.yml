name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Local test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: MCP contract tests
        run: npm run test:mcp-contract

      - name: Authentication tests
        run: npm run test:auth

      - name: Security tests
        run: npm run test:security

      - name: Deployment tests
        run: npm run test:deployment

      - name: Release-readiness checks
        run: npm run check:release


  plugin-package:
    name: Validate Marketplace plugin package
    runs-on: ubuntu-latest
    env:
      AGENT_WORKSPACE_MCP_URL: https://agent-workspace.example.test/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build Marketplace package
        run: npm run plugin:build -- --version 0.0.0-ci --target marketplace
      - name: Validate Marketplace package
        run: |
          test -f build/plugin-marketplace/agent-workspace/plugin.json
          test -f build/plugin-marketplace/agent-workspace/mcp.json
          test -f build/plugin-marketplace/agent-workspace/skills/agent-workspace/SKILL.md
          test -f build/plugin-marketplace/agent-workspace/assets/logo.png
          test -f build/plugin-marketplace/agent-workspace/assets/composer-icon.png
          test ! -e build/plugin-marketplace/agent-workspace/.app.json
          test ! -e build/plugin-marketplace/agent-workspace/.codex-plugin
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('build/plugin-marketplace/agent-workspace/plugin.json'));const o=p.extensions?.['com.openai'];if(p.name!=='agent-workspace'||p.version!=='0.0.0-ci'||p.apps!=null||o?.apps!=null||o?.publication?.countries?.[0]!=='SE'||o?.review?.commerce!==false)process.exit(1)"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('build/plugin-marketplace/agent-workspace/mcp.json'));if(m.mcpServers['agent-workspace'].type!=='streamable-http'||m.mcpServers['agent-workspace'].url!=='https://agent-workspace.example.test/mcp')process.exit(1)"
