name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    name: Local test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate lockfile candidate
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Lägg till package-lock för reproducerbara byggen"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: MCP contract tests
        run: npm run test:mcp-contract

      - name: Authentication tests
        run: npm run test:auth

      - name: Security tests
        run: npm run test:security

      - name: Deployment tests
        run: npm run test:deployment

      - name: Release-readiness checks
        run: npm run check:release
