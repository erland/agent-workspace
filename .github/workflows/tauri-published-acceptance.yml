name: Tauri Published Runtime Acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tauri-runtime/acceptance/**"
      - ".github/workflows/tauri-published-acceptance.yml"
  push:
    branches: [main]
    paths:
      - "tauri-runtime/acceptance/**"
      - ".github/workflows/tauri-published-acceptance.yml"

permissions:
  contents: read
  packages: read

jobs:
  tauri-acceptance:
    name: Verify published Tauri image with real Tauri v2 build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Guard temporary build-only risk acceptance
        shell: bash
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [[ "$today" > "2026-12-08" ]]; then
            echo "::error::Kernel-header risk review expired on 2026-12-08"
            exit 1
          fi
          if [[ "$today" > "2026-12-09" ]]; then
            echo "::error::WebKitGTK build-only risk acceptance expired on 2026-12-09"
            exit 1
          fi
      - name: Authenticate for published image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published immutable image (not local Dockerfile)
        run: docker pull ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:tauri-linux-v1
      - name: Verify published image tools without launching WebKitGTK
        run: |
          docker run --rm --entrypoint /bin/bash ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:tauri-linux-v1 -lc '
            set -euo pipefail
            test "$(id -u)" -ne 0
            test -z "${DISPLAY:-}"
            test -z "${WAYLAND_DISPLAY:-}"
            rustc --version
            cargo --version
            node --version
            npm --version
            pkg-config --modversion webkit2gtk-4.1
          '
      - name: Verify real Tauri v2 frontend, Cargo and CLI build without launching GUI
        run: |
          docker run --rm \
            --mount type=bind,source="${{ github.workspace }}/tauri-runtime/acceptance",target=/fixture,readonly \
            --entrypoint /bin/bash \
            ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:tauri-linux-v1 -lc '
              set -euo pipefail
              cp -a /fixture /tmp/tauri-acceptance
              cd /tmp/tauri-acceptance
              npm install --no-audit --no-fund
              npm run build
              cd src-tauri
              cargo test --lib
              cd ..
              ./node_modules/.bin/tauri build --no-bundle
              test -f src-tauri/target/release/agent-workspace-tauri-acceptance
              echo "TAURI_REAL_BUILD=PASS (GUI NOT EXECUTED)"
            '
      - name: Record acceptance boundary
        if: always()
        run: |
          {
            echo "## LANG-003D – published Tauri runtime"
            echo "Image: ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:tauri-linux-v1"
            echo "Exercises published image, npm build, Cargo unit tests and real Tauri CLI build --no-bundle."
            echo "**No GUI or WebKitGTK runtime execution. No Windows/macOS build.**"
            echo "Live Modal acceptance and deployment are separate release gates."
          } >> "$GITHUB_STEP_SUMMARY"
