name: Release Application Image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AGENT_WORKSPACE_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.title=Agent Workspace
          cache-from: type=gha,scope=agent-workspace-release
          cache-to: type=gha,mode=max,scope=agent-workspace-release

      - name: Summary
        run: |
          echo "### Published application image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this exact tag in Coolify for a reproducible deployment." >> "$GITHUB_STEP_SUMMARY"
