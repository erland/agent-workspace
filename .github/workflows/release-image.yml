name: Release Application Image and Plugin

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AGENT_WORKSPACE_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.title=Agent Workspace
          cache-from: type=gha,scope=agent-workspace-release
          cache-to: type=gha,mode=max,scope=agent-workspace-release

      - name: Summary
        run: |
          echo "### Published application image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this exact tag in Coolify for a reproducible deployment." >> "$GITHUB_STEP_SUMMARY"

  publish-plugin:
    name: Build and publish OpenAI plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENT_WORKSPACE_MCP_URL: ${{ vars.AGENT_WORKSPACE_MCP_URL || 'https://agent-workspace.apphome.one/mcp' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Marketplace plugin package
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          npm run plugin:build -- --version "$VERSION" --target marketplace
          mkdir -p build
          (cd build/plugin-marketplace && zip -qr "../agent-workspace-plugin-${VERSION}.zip" agent-workspace)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=build/agent-workspace-plugin-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect Marketplace plugin archive
        run: |
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" agent-workspace/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.name!=='agent-workspace'||p.version!=='${{ steps.plugin.outputs.version }}'||p.apps!=null||p.extensions?.['com.openai']?.apps!=null)process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" agent-workspace/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const m=JSON.parse(s);if(m.mcpServers?.['agent-workspace']?.url!=='${AGENT_WORKSPACE_MCP_URL}')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" agent-workspace/skills/agent-workspace/SKILL.md >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" agent-workspace/assets/logo.png >/dev/null
          unzip -p "${{ steps.plugin.outputs.archive }}" agent-workspace/assets/composer-icon.png >/dev/null
          if unzip -l "${{ steps.plugin.outputs.archive }}" | grep -Eq '\.app\.json|\.codex-plugin/'; then
            echo "Marketplace upload must not contain app bindings or compatibility update manifests." >&2
            exit 1
          fi

      - name: Attach plugin ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.plugin.outputs.archive }}" --clobber
