name: Release Application Image and Plugin

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish application image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            AGENT_WORKSPACE_VERSION=${{ github.event.release.tag_name }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.title=Agent Workspace
          cache-from: type=gha,scope=agent-workspace-release
          cache-to: type=gha,mode=max,scope=agent-workspace-release

      - name: Summary
        run: |
          echo "### Published application image" >> "$GITHUB_STEP_SUMMARY"
          echo '`${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use this exact tag in Coolify for a reproducible deployment." >> "$GITHUB_STEP_SUMMARY"

  publish-plugin:
    name: Build and publish OpenAI plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AGENT_WORKSPACE_MCP_URL: ${{ vars.AGENT_WORKSPACE_MCP_URL || 'https://agent-workspace.apphome.one/mcp' }}
      AGENT_WORKSPACE_CHATGPT_APP_ID: ${{ vars.AGENT_WORKSPACE_CHATGPT_APP_ID }}
      AGENT_WORKSPACE_CHATGPT_PLUGIN_NAME: ${{ vars.AGENT_WORKSPACE_CHATGPT_PLUGIN_NAME }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build ChatGPT update and desktop plugin packages
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${AGENT_WORKSPACE_CHATGPT_APP_ID}" ]]; then
            echo "Repository variable AGENT_WORKSPACE_CHATGPT_APP_ID must contain the registered ChatGPT app id before release." >&2
            exit 1
          fi
          npm run plugin:build -- --version "$VERSION" --target chatgpt
          npm run plugin:build -- --version "$VERSION" --target desktop
          mkdir -p build
          (cd build/plugin-chatgpt && zip -qr "../agent-workspace-plugin-${VERSION}.zip" .app.json .codex-plugin)
          (cd build/plugin-desktop && zip -qr "../agent-workspace-plugin-desktop-${VERSION}.zip" agent-workspace)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "archive=build/agent-workspace-plugin-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "desktop_archive=build/agent-workspace-plugin-desktop-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Inspect plugin archives
        run: |
          unzip -l "${{ steps.plugin.outputs.archive }}"
          unzip -p "${{ steps.plugin.outputs.archive }}" .codex-plugin/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const p=JSON.parse(s);if(p.version!=='${{ steps.plugin.outputs.version }}'||!p.name.startsWith('dev-')||p.apps!=='./.app.json')process.exit(1)})"
          unzip -p "${{ steps.plugin.outputs.archive }}" .app.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const a=JSON.parse(s);const names=Object.keys(a.apps||{});if(names.length!==1||a.apps[names[0]].id!=='${AGENT_WORKSPACE_CHATGPT_APP_ID}')process.exit(1)})"
          if unzip -l "${{ steps.plugin.outputs.archive }}" | grep -Eq '(^|[[:space:]])agent-workspace/|mcp.json'; then
            echo "ChatGPT update package must have no extra top directory and no mcp.json" >&2
            exit 1
          fi
          unzip -p "${{ steps.plugin.outputs.desktop_archive }}" agent-workspace/plugin.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"
          unzip -p "${{ steps.plugin.outputs.desktop_archive }}" agent-workspace/mcp.json | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>JSON.parse(s))"

      - name: Attach plugin ZIPs to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.plugin.outputs.archive }}" "${{ steps.plugin.outputs.desktop_archive }}" --clobber
