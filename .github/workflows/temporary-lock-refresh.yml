name: Temporary dependency lock refresh
on:
  push:
    branches: [fix/shorter-modal-lifetime-artifact-links]
permissions:
  contents: read
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const j=require('./package-lock.json');
          console.log('LOCK_DELTA_BEGIN');
          for (const k of ['node_modules/@modelcontextprotocol/core','node_modules/@modelcontextprotocol/client','node_modules/@modelcontextprotocol/server']) {
            console.log(k+' '+JSON.stringify(j.packages[k]));
          }
          console.log('LOCK_DELTA_END');
          NODE
