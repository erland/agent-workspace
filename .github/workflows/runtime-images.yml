name: Runtime Images

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "runtime-images/**"
      - ".github/workflows/runtime-images.yml"
  push:
    branches:
      - main
    paths:
      - "runtime-images/**"
      - ".github/workflows/runtime-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: java${{ matrix.java }}-node${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read runtime image version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < runtime-images/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build locally for functional validation
        uses: docker/build-push-action@v6
        with:
          context: runtime-images
          file: runtime-images/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
            NODE_MAJOR=${{ matrix.node }}
          tags: agent-workspace-runtime:smoke
          cache-from: type=gha,scope=runtime-java${{ matrix.java }}-node${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=runtime-java${{ matrix.java }}-node${{ matrix.node }}

      - name: Run unprivileged Maven and npm smoke tests
        run: docker run --rm --mount type=bind,source="${{ github.workspace }}/runtime-images/smoke.sh",target=/tmp/smoke.sh,readonly agent-workspace-runtime:smoke bash /tmp/smoke.sh

      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-workspace-runtime:smoke
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: security/trivy-runtime-ignore.yaml

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse overwrite of existing runtime tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}
          PACKAGE_NAME: agent-workspace-runtime
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100"
          tmp="$(mktemp)"
          set +e
          gh api --paginate "${endpoint}" > "${tmp}" 2>gh-api-error.txt
          status=$?
          set -e
          if [ "${status}" -ne 0 ]; then
            if grep -q "HTTP 404" gh-api-error.txt; then
              rm -f "${tmp}" gh-api-error.txt
            else
              cat gh-api-error.txt >&2
              rm -f "${tmp}" gh-api-error.txt
              exit "${status}"
            fi
          else
            if jq -e --arg tag "${IMAGE_TAG}" '.[] | select(any(.metadata.container.tags[]?; . == $tag))' "${tmp}" >/dev/null; then
              echo "::error::Runtime image tag ${IMAGE_TAG} already exists in GHCR. Increment runtime-images/version.txt before publishing a changed runtime image."
              rm -f "${tmp}" gh-api-error.txt
              exit 1
            fi
            rm -f "${tmp}" gh-api-error.txt
          fi

      - name: Publish validated image
        if: github.event_name != 'pull_request'
        run: |
          docker tag agent-workspace-runtime:smoke ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}
          docker push ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}`' >> "$GITHUB_STEP_SUMMARY"

  playwright-chromium:
    name: optional-playwright-chromium-node22
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read runtime image version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < runtime-images/version.txt)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build base image locally
        uses: docker/build-push-action@v6
        with:
          context: runtime-images
          file: runtime-images/Dockerfile
          build-args: |
            JAVA_VERSION=21
            NODE_MAJOR=22
          load: true
          tags: agent-workspace-runtime:base
          cache-from: type=gha,scope=runtime-java21-node22
      # The first build loads the base image into the Docker daemon. Using the
      # default docker builder here makes that local image visible to FROM.
      # The isolated build-push-action builder cannot resolve daemon-local tags.
      - name: Build optional Playwright image
        shell: bash
        run: |
          docker buildx build --builder default --load \
            --file runtime-images/Dockerfile.playwright \
            --build-arg BASE_IMAGE=agent-workspace-runtime:base \
            --build-arg PLAYWRIGHT_VERSION=1.56.1 \
            --tag agent-workspace-runtime:playwright-smoke \
            runtime-images
      - name: Run Chromium as unprivileged user
        run: docker run --rm --mount type=bind,source="${{ github.workspace }}/runtime-images/playwright-smoke.sh",target=/tmp/playwright-smoke.sh,readonly agent-workspace-runtime:playwright-smoke bash /tmp/playwright-smoke.sh
      - name: Scan optional runtime
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-workspace-runtime:playwright-smoke
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: security/trivy-runtime-ignore.yaml
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwrite of existing Playwright runtime tag
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: playwright-chromium-node22-v${{ steps.version.outputs.value }}
          PACKAGE_NAME: agent-workspace-runtime
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="/users/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=100"
          tmp="$(mktemp)"
          if gh api --paginate "${endpoint}" > "${tmp}" 2>gh-api-error.txt; then
            if jq -e --arg tag "${IMAGE_TAG}" '.[] | select(any(.metadata.container.tags[]?; . == $tag))' "${tmp}" >/dev/null; then
              echo "::error::Image tag ${IMAGE_TAG} already exists; increment runtime-images/version.txt for all seven runtime images"
              exit 1
            fi
          elif ! grep -q "HTTP 404" gh-api-error.txt; then
            cat gh-api-error.txt >&2
            exit 1
          fi
      - name: Publish optional Playwright image
        if: github.event_name != 'pull_request'
        run: |
          docker tag agent-workspace-runtime:playwright-smoke ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:playwright-chromium-node22-v${{ steps.version.outputs.value }}
          docker push ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:playwright-chromium-node22-v${{ steps.version.outputs.value }}
