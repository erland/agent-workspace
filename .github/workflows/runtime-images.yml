name: Runtime Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "runtime-images/**"
      - ".github/workflows/runtime-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: java${{ matrix.java }}-node${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read runtime image version
        id: version
        shell: bash
        run: echo "value=$(tr -d '[:space:]' < runtime-images/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runtime-images
          file: runtime-images/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.java }}
            NODE_MAJOR=${{ matrix.node }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=runtime-java${{ matrix.java }}-node${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=runtime-java${{ matrix.java }}-node${{ matrix.node }}

      - name: Summary
        run: |
          echo "### Published runtime image" >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/${{ github.repository_owner }}/agent-workspace-runtime:java${{ matrix.java }}-node${{ matrix.node }}-v${{ steps.version.outputs.value }}`' >> "$GITHUB_STEP_SUMMARY"
